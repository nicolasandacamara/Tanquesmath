      - uses: actions/upload-artifact@v4
        with:
          name: TanquesDeCuentas
          path: TanquesDeCuentas.apk
      - name: Publicar para descargar desde el telefono
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "v1.${{ github.run_number }}" TanquesDeCuentas.apk --title "Tanques de Cuentas v1.${{ github.run_number }}" --notes "Baja TanquesDeCuentas.apk desde el telefono e instalalo."
