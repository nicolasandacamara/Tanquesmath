yaml
name: Generar APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Compilar
        run: gradle assembleDebug --no-daemon
      - name: Preparar archivo
        run: cp app/build/outputs/apk/debug/app-debug.apk TanquesDeCuentas.apk
      - uses: actions/upload-artifact@v4
        with:
          name: TanquesDeCuentas
          path: TanquesDeCuentas.apk
      - name: Publicar para descargar desde el teléfono
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "v1.${{ github.run_number }}" TanquesDeCuentas.apk --title "Tanques de Cuentas v1.${{ github.run_number }}" --notes "Bajá TanquesDeCuentas.apk desde el teléfono e instalalo.
