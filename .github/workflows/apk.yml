name: Generar APK

# Esta receta arma sola todo el proyecto de Android alrededor de index.html (el juego)
# y genera el APK. Para actualizar el juego, solo hay que reemplazar index.html.

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Armar el proyecto
        run: |
          test -f index.html || { echo "Falta subir index.html a la raiz del repositorio"; exit 1; }
          mkdir -p $(dirname settings.gradle)
          cat > settings.gradle <<'FIN'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "TanquesDeCuentas"
          include ':app'
          FIN
          mkdir -p $(dirname build.gradle)
          cat > build.gradle <<'FIN'
          plugins { id 'com.android.application' version '8.5.2' apply false }
          FIN
          mkdir -p $(dirname gradle.properties)
          cat > gradle.properties <<'FIN'
          org.gradle.jvmargs=-Xmx2048m
          android.useAndroidX=true
          FIN
          mkdir -p $(dirname app/build.gradle)
          cat > app/build.gradle <<'FIN'
          plugins { id 'com.android.application' }

          android {
              namespace 'ar.nicolas.tanques'
              compileSdk 34

              defaultConfig {
                  applicationId 'ar.nicolas.tanques'
                  minSdk 24
                  targetSdk 34
                  // Cada compilación en GitHub sube el número de versión, así el teléfono acepta la actualización.
                  versionCode((System.getenv('GITHUB_RUN_NUMBER') ?: '1') as int)
                  versionName "1.${System.getenv('GITHUB_RUN_NUMBER') ?: '0'}"
              }

              // Firma fija: así cada APK nuevo se instala ENCIMA del anterior sin borrar el avance del juego.
              signingConfigs {
                  fija {
                      storeFile file('tanques.keystore')
                      storePassword 'tanques2026'
                      keyAlias 'tanques'
                      keyPassword 'tanques2026'
                  }
              }
              buildTypes {
                  debug { signingConfig signingConfigs.fija }
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          FIN
          mkdir -p $(dirname app/src/main/AndroidManifest.xml)
          cat > app/src/main/AndroidManifest.xml <<'FIN'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <application
                  android:label="Tanques de Cuentas"
                  android:icon="@drawable/ic_launcher"
                  android:allowBackup="true"
                  android:theme="@android:style/Theme.Material.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:screenOrientation="portrait"
                      android:configChanges="orientation|screenSize|keyboardHidden|smallestScreenSize|screenLayout">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          FIN
          mkdir -p $(dirname app/src/main/java/ar/nicolas/tanques/MainActivity.java)
          cat > app/src/main/java/ar/nicolas/tanques/MainActivity.java <<'FIN'
          package ar.nicolas.tanques;

          import android.app.Activity;
          import android.graphics.Color;
          import android.os.Bundle;
          import android.view.WindowManager;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;

          // La app es una ventana que muestra el juego (index.html, que va adentro del APK y funciona sin internet).
          public class MainActivity extends Activity {
              private WebView web;

              @Override
              protected void onCreate(Bundle saved) {
                  super.onCreate(saved);
                  getWindow().addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON);
                  getWindow().setStatusBarColor(Color.parseColor("#18263a"));
                  getWindow().setNavigationBarColor(Color.parseColor("#18263a"));

                  web = new WebView(this);
                  web.setBackgroundColor(Color.parseColor("#18263a"));
                  WebSettings s = web.getSettings();
                  s.setJavaScriptEnabled(true);
                  s.setDomStorageEnabled(true);          // guarda medallas, nivel y progreso de sumas
                  s.setMediaPlaybackRequiresUserGesture(false);
                  s.setAllowFileAccess(true);
                  web.setWebViewClient(new WebViewClient());
                  setContentView(web);

                  if (saved != null) web.restoreState(saved);
                  else web.loadUrl("file:///android_asset/index.html");
              }

              @Override
              protected void onSaveInstanceState(Bundle out) {
                  super.onSaveInstanceState(out);
                  web.saveState(out);
              }

              @Override
              protected void onPause() { super.onPause(); web.onPause(); }

              @Override
              protected void onResume() { super.onResume(); web.onResume(); }
          }
          FIN
          mkdir -p $(dirname app/src/main/res/drawable/ic_launcher.xml)
          cat > app/src/main/res/drawable/ic_launcher.xml <<'FIN'
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp" android:height="108dp"
              android:viewportWidth="100" android:viewportHeight="100">
              <path android:fillColor="#18263a" android:pathData="M22,0h56a22,22 0 0 1 22,22v56a22,22 0 0 1 -22,22h-56a22,22 0 0 1 -22,-22v-56a22,22 0 0 1 22,-22z"/>
              <path android:fillColor="#ffd23f" android:pathData="M72,24m-12,0a12,12 0 1,0 24,0a12,12 0 1,0 -24,0"/>
              <path android:fillColor="#5aa646" android:pathData="M0,72h100v6a22,22 0 0 1 -22,22h-56a22,22 0 0 1 -22,-22z"/>
              <path android:fillColor="#26803c" android:pathData="M52,44L80,30L83,35L55,49z"/>
              <path android:fillColor="#3fae5a" android:pathData="M36,48a14,14 0 0 1 28,0z"/>
              <path android:fillColor="#3fae5a" android:pathData="M27,48h46a5,5 0 0 1 5,5v5a5,5 0 0 1 -5,5h-46a5,5 0 0 1 -5,-5v-5a5,5 0 0 1 5,-5z"/>
              <path android:fillColor="#2b2b2b" android:pathData="M25,62h50a7,7 0 0 1 0,14h-50a7,7 0 0 1 0,-14z"/>
          </vector>
          FIN
          mkdir -p app/src/main/assets
          cp index.html app/src/main/assets/index.html
